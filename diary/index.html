<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>日記 | Study Notes</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body><nav><div class="wrap"><a href="../index.html" class="logo">Study<span>Notes</span></a><div class="menu"><a href="../diary/index.html" class="hide">日記</a><a href="../index.html#works" class="hide">成果物</a><button class="theme" id="theme" aria-label="テーマ切り替え">◐</button></div></div></nav>
<main class="page">
  <div class="eyebrow">Diary</div>
  <h1>日記</h1>
  <p class="sec-lead">自分の活動記録です。</p>
  <input class="search" id="q" type="search" placeholder="キーワードで探す" style="width:100%;margin-bottom:18px">
  <div class="entries" id="list"></div>
</main>
<script src="../assets/diary.js"></script>
<script src="../assets/common.js"></script>
<script>
(async () => {
  const list = document.getElementById("list"), q = document.getElementById("q");
  let posts = [];
  try { posts = (await D.loadIndex()).sort((a, b) => b.date.localeCompare(a.date)); }
  catch (e) { list.innerHTML = '<p class="sec-lead">読み込めませんでした。</p>'; return; }
  function render() {
    const kw = q.value.trim().toLowerCase();
    const s = posts.filter(p => !kw || (p.title + (p.excerpt || "")).toLowerCase().includes(kw));
    list.innerHTML = s.length ? s.map(p => `<a class="entry" href="post.html?id=${encodeURIComponent(p.id)}">
      <time>${D.fmtDate(p.date)}</time><h3>${D.esc(p.title)}</h3><p>${D.esc(p.excerpt || "")}</p></a>`).join("")
      : '<p class="sec-lead">まだ投稿がありません。</p>';
  }
  q.addEventListener("input", render); render();
})();
</script>
<script src="../assets/counter.js"></script>
</body></html>
