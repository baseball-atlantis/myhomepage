<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Study Notes</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<nav>
  <div class="wrap">
    <a href="../../index.html" class="logo">Study<span>Notes</span></a>
    <div class="menu"><button class="theme" id="theme" aria-label="テーマ切り替え">◐</button></div>
  </div>
</nav>

<main class="note">
  <a class="back" href="../../index.html#works">← 一覧に戻る</a>
  <div class="meta"><span class="tag">{{TYPE}}</span><span>{{DATE}}</span></div>
  <h1>{{TITLE}}</h1>
  <p class="summary">{{SUMMARY}}</p>

  <!-- ここから本文 -->
{{BODY}}
  <!-- ここまで本文 -->
</main>

<footer><a href="../../index.html#works" style="color:var(--a2)">← 他の成果物を見る</a></footer>
<script src="../../assets/common.js"></script>
</body>
</html>
